    <style>
      /* Fundo de boot — cor sólida escura antes do React montar.
         A splash institucional é renderizada UMA VEZ pelo componente
         <SplashScreen>. Antes usávamos a arte como background-image
         aqui também, o que causava sensação de "splash duplicada"
         quando o overlay animado fazia fade-out. */
      html, body, #root {
        background-color: #050505;
      }

      /* Trava a altura no mobile para evitar redimensionamento quando a barra de endereço aparece/some */
      @media (max-width: 767px) {
        html, body {
          height: 100dvh;
          min-height: 100dvh;
          max-height: 100dvh;
          overflow: hidden;
          overscroll-behavior: none;
          position: fixed;
          inset: 0;
          width: 100%;
          touch-action: pan-y pinch-zoom;
        }
        #root {
          height: 100dvh;
          max-height: 100dvh;
          overflow: hidden;
        }
      }
      @media (min-width: 768px) {
        html, body, #root { min-height: 100vh; }
      }
    </style>
